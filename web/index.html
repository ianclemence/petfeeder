<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automatic Pet Feeder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }

    .subtitle {
      color: #64748b;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 700px;
      width: 100%;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #334155;
    }

    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 12px;
    }

    .distance-display {
      font-size: 3.5rem;
      font-weight: 700;
      text-align: center;
      padding: 10px 0;
      transition: color 0.3s;
    }

    .distance-display.near { color: #22c55e; }
    .distance-display.far  { color: #ef4444; }

    .distance-unit {
      font-size: 1rem;
      color: #64748b;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge.feeding {
      background: #166534;
      color: #4ade80;
      animation: pulse 1.5s infinite;
    }

    .status-badge.idle {
      background: #1e3a5f;
      color: #38bdf8;
    }

    .status-badge.waiting {
      background: #422006;
      color: #fbbf24;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .pet-visual {
      width: 80px;
      height: 80px;
      margin: 15px auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      transition: all 0.3s;
    }

    .pet-visual.near {
      background: rgba(34, 197, 94, 0.15);
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
    }

    .pet-visual.far {
      background: rgba(239, 68, 68, 0.1);
    }

    .btn-feed {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .btn-feed.feed {
      background: #22c55e;
      color: #000;
    }

    .btn-feed.feed:hover { background: #16a34a; }

    .btn-feed.stop {
      background: #ef4444;
      color: #fff;
    }

    .btn-feed.stop:hover { background: #dc2626; }

    .btn-feed:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chart-card {
      grid-column: 1 / -1;
    }

    .chart-container {
      position: relative;
      height: 150px;
      margin-top: 10px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .last-feed {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 12px;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #64748b;
    }

    .legend span::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .legend .detected::before { background: #22c55e; }
    .legend .threshold::before { background: #ef4444; }

    .connection-status {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .connection-status.connected { background: #166534; color: #4ade80; }
    .connection-status.disconnected { background: #7f1d1d; color: #fca5a5; }
  </style>
</head>
<body>

  <div class="connection-status" id="connStatus">Connecting...</div>

  <h1>Automatic Pet Feeder</h1>
  <p class="subtitle">Distance-triggered feeding system &mdash; no timer needed</p>

  <div class="grid">
    <!-- Distance Card -->
    <div class="card">
      <h2>Sensor Distance</h2>
      <div class="distance-display" id="distanceDisplay">--</div>
      <div class="distance-unit">centimeters</div>
      <div class="pet-visual far" id="petVisual">No pet</div>
    </div>

    <!-- Status Card -->
    <div class="card">
      <h2>Feeder Status</h2>
      <div style="text-align:center; padding: 20px 0;">
        <span class="status-badge waiting" id="statusBadge">WAITING</span>
      </div>
      <div class="last-feed" id="lastFeed">Last feed: Never</div>
      <div class="legend">
        <span class="detected">Pet detected (&lt;20cm)</span>
      </div>
      <button class="btn-feed feed" id="feedBtn" onclick="manualFeed()">
        Manual Feed
      </button>
    </div>

    <!-- Chart Card -->
    <div class="card chart-card">
      <h2>Distance History (last 30 readings)</h2>
      <div class="chart-container">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ---- CONFIGURATION ----
    const API_BASE = '';  // Same origin (localhost:8080)
    const POLL_INTERVAL = 1000;  // Poll every 1 second
    const DETECT_THRESHOLD = 20; // cm - pet detection zone

    // ---- STATE ----
    let chartData = [];
    let connected = false;
    let isFeeding = false;

    // ---- DOM ELEMENTS ----
    const distanceDisplay = document.getElementById('distanceDisplay');
    const petVisual = document.getElementById('petVisual');
    const statusBadge = document.getElementById('statusBadge');
    const lastFeed = document.getElementById('lastFeed');
    const feedBtn = document.getElementById('feedBtn');
    const connStatus = document.getElementById('connStatus');
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');

    // ---- POLLING ----
    async function fetchStatus() {
      try {
        const res = await fetch(`${API_BASE}/api/status`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        updateUI(data);
        setConnected(true);
      } catch (e) {
        setConnected(false);
      }
    }

    function updateUI(data) {
      const dist = data.distance;
      const feeding = data.feeding;

      // Distance display
      distanceDisplay.textContent = dist.toFixed(1);
      const isNear = dist > 0 && dist < DETECT_THRESHOLD;
      distanceDisplay.className = 'distance-display ' + (isNear ? 'near' : 'far');

      // Pet visual
      petVisual.className = 'pet-visual ' + (isNear ? 'near' : 'far');
      petVisual.innerHTML = isNear ? 'Cat!' : 'No pet';

      // Status badge
      statusBadge.className = 'status-badge ' + data.status;
      statusBadge.textContent = data.status.toUpperCase();

      // Feed button
      isFeeding = feeding;
      if (feeding) {
        feedBtn.className = 'btn-feed stop';
        feedBtn.textContent = 'Stop Feeding';
        feedBtn.onclick = stopFeed;
      } else {
        feedBtn.className = 'btn-feed feed';
        feedBtn.textContent = 'Manual Feed';
        feedBtn.onclick = manualFeed;
      }

      // Last feed time
      if (data.last_feed) {
        const ago = Math.floor((Date.now() / 1000) - data.last_feed);
        lastFeed.textContent = `Last feed: ${ago}s ago`;
      }

      // Chart data
      if (data.history && data.history.length > 0) {
        chartData = data.history.map(h => h.d);
        drawChart();
      }
    }

    function setConnected(val) {
      connected = val;
      connStatus.textContent = val ? 'Connected' : 'Disconnected';
      connStatus.className = 'connection-status ' + (val ? 'connected' : 'disconnected');
    }

    // ---- COMMANDS ----
    async function manualFeed() {
      try {
        await fetch(`${API_BASE}/api/feed`, { method: 'POST' });
      } catch (e) {
        console.error('Feed command failed:', e);
      }
    }

    async function stopFeed() {
      try {
        await fetch(`${API_BASE}/api/close`, { method: 'POST' });
      } catch (e) {
        console.error('Stop command failed:', e);
      }
    }

    // ---- CHART DRAWING ----
    function drawChart() {
      const w = canvas.width = canvas.parentElement.clientWidth;
      const h = canvas.height = canvas.parentElement.clientHeight;

      ctx.clearRect(0, 0, w, h);

      if (chartData.length < 2) return;

      const maxDist = Math.max(...chartData, DETECT_THRESHOLD + 10);
      const padding = { top: 10, bottom: 25, left: 40, right: 10 };
      const plotW = w - padding.left - padding.right;
      const plotH = h - padding.top - padding.bottom;

      // Grid lines
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (plotH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(w - padding.right, y);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        const val = Math.round(maxDist - (maxDist / 4) * i);
        ctx.fillText(val + 'cm', padding.left - 5, y + 4);
      }

      // Threshold line (20cm)
      const threshY = padding.top + plotH * (1 - DETECT_THRESHOLD / maxDist);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 1;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(padding.left, threshY);
      ctx.lineTo(w - padding.right, threshY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#ef4444';
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('20cm threshold', padding.left + 4, threshY - 4);

      // Distance line
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      chartData.forEach((val, i) => {
        const x = padding.left + (plotW / (chartData.length - 1)) * i;
        const y = padding.top + plotH * (1 - val / maxDist);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Fill under line
      const lastX = padding.left + plotW;
      const lastY = padding.top + plotH * (1 - chartData[chartData.length - 1] / maxDist);
      ctx.lineTo(lastX, padding.top + plotH);
      ctx.lineTo(padding.left, padding.top + plotH);
      ctx.closePath();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
      ctx.fill();
    }

    // ---- INIT ----
    setInterval(fetchStatus, POLL_INTERVAL);
    fetchStatus();
    window.addEventListener('resize', drawChart);
  </script>
</body>
</html>
